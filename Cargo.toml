[package]
name = "default-helper"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = "1.18.1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-icons = "0.4"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
slint-build = "1.18.1"

[dev-dependencies]
tempfile = "3"
